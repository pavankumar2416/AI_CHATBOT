<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot V2</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    

</head>

<body>

    <!-- Mobile Menu -->
    <button id="menuBtn">
        <i class="fas fa-bars"></i>
    </button>

   <div class="container">

    <aside class="sidebar">

        <div class="logo">
            <h1>Nova AI</h1>
            
        </div>

        <button id="newChat">
            💬 New Chat
        </button>

        <button id="exportChat">
            📄 Export Chat
        </button>

        <button id="clearChat">
            🗑 Clear Chat
        </button>

      
        <div id="chatHistory"></div>

    </aside>

    <main class="chat-section">

        <div class="welcome-screen" id="welcomeScreen">

            <h1>Nova AI</h1>

            <p>
                Your Intelligent AI Assistant
            </p>

            <div class="prompt-grid">

                <button onclick="fillPrompt('Build a portfolio website')">
                    🌐 Build a portfolio website
                </button>

                <button onclick="fillPrompt('Explain Python loops')">
                    🐍 Explain Python loops
                </button>

                <button onclick="fillPrompt('Create a resume')">
                    📄 Create a resume
                </button>

                <button onclick="fillPrompt('Give me project ideas')">
                    🚀 Project ideas
                </button>

            </div>

        </div>

        <div id="chat-box"></div>

        <div class="input-container">

            <button id="micBtn">
                🎤
            </button>

            <textarea
                id="userInput"
                placeholder="Message Nova AI..."
            ></textarea>

            <button id="sendBtn">
                ➤
            </button>

        </div>

    </main>

</div>

    <script src="script.js"></script>

</body>

</html>
